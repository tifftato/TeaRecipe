name: Lupicia Recipe Bot

on:
  schedule:
    # 한국 시간(KST) 오전 10시에 실행되도록 설정 (UTC 기준 오전 1시)
    - cron: '0 1 * * *'
  workflow_dispatch: # 깃허브 홈페이지에서 수동으로 실행해볼 수 있는 버튼 생성

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: 저장소 코드 가져오기
        uses: actions/checkout@v4

      - name: 파이썬 설치
        uses: actions/setup-python@v5
        with:
          python-version: '3.10' # 원하는 파이썬 버전

      - name: 필요한 패키지 설치
        run: pip install openai requests beautifulsoup4

      - name: 파이썬 스크립트 실행 (여기가 핵심!)
        env:
          # 깃허브 Secret에 있는 값을 파이썬 환경 변수(env)로 주입합니다.
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python main.py
